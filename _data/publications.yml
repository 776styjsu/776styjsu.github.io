  summary: "Can a driving model’s reasoning tell us what it should do next? We study whether vision-language-action (VLA) models’ reasoning can serve as a specification for monitoring their planned trajectories."
  finding: "A benchmark of 150 manually annotated reasoning–trajectory pairs; lane-relative monitors achieve an F1 score of 0.75 for inconsistency detection, 0.13 above the strongest baseline."
